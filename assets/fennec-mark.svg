<svg xmlns="http://www.w3.org/2000/svg" viewBox="240 120 602 690" role="img" aria-label="Fennec">
  <!-- Fennec: the fox in profile, ear up. The app icon's mascot without the plate (a Cut in ICON_STYLE.md). -->
  <title>Fennec</title>
  <defs>
    <clipPath id="fox">
      <polygon points="300,130 560,470 300,560"/>
      <polygon points="300,540 520,440 640,500 820,650 800,690 600,720 420,800 250,760"/>
    </clipPath>
    <clipPath id="earBack"><polygon points="470,170 640,500 520,460"/></clipPath>
    <clipPath id="earIn"><polygon points="330,230 500,470 340,520"/></clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.365" numOctaves="2" seed="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" result="gray"
        values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/>
      <feComponentTransfer in="gray" result="stipple">
        <feFuncR type="linear" slope="1.45" intercept="-0.22"/>
        <feFuncG type="linear" slope="1.45" intercept="-0.22"/>
        <feFuncB type="linear" slope="1.45" intercept="-0.22"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="stipple" mode="overlay" result="printed"/>
      <feComposite in="printed" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <g clip-path="url(#earBack)"><rect x="240" y="120" width="602" height="690" fill="#5E3D1B"/></g>
    <g clip-path="url(#fox)">
      <rect x="240" y="120" width="602" height="690" fill="#BF8A4A"/>
      <polygon points="420,600 842,560 842,810 300,810" fill="#5E3D1B"/>
      <polygon points="240,120 400,120 300,640 240,640" fill="#F3F0E6"/>
      <polygon points="270,110 340,110 330,190 290,180" fill="#F5C400"/>
    </g>
    <g clip-path="url(#earIn)"><rect x="240" y="120" width="602" height="690" fill="#4A2F16"/></g>
    <polygon points="600,700 820,650 800,690" fill="#F3F0E6"/>
    <polygon points="560,560 600,536 644,560 600,578" fill="#2A1B0C"/>
    <polygon points="790,630 832,650 800,676" fill="#2A1B0C"/>
  </g>
</svg>
