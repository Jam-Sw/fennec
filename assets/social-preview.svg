<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <!-- GitHub social preview. Render: rsvg-convert -w 1280 assets/social-preview.svg -o assets/social-preview.png -->
  <defs>
    <clipPath id="fox">
      <polygon points="300,130 560,470 300,560"/>
      <polygon points="300,540 520,440 640,500 820,650 800,690 600,720 420,800 250,760"/>
    </clipPath>
    <clipPath id="earBack"><polygon points="470,170 640,500 520,460"/></clipPath>
    <clipPath id="earIn"><polygon points="330,230 500,470 340,520"/></clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.29" numOctaves="2" seed="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" result="gray"
        values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/>
      <feComponentTransfer in="gray" result="stipple">
        <feFuncR type="linear" slope="1.45" intercept="-0.22"/>
        <feFuncG type="linear" slope="1.45" intercept="-0.22"/>
        <feFuncB type="linear" slope="1.45" intercept="-0.22"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="stipple" mode="overlay" result="printed"/>
      <feComposite in="printed" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <g filter="url(#grain)">
    <rect width="1280" height="640" fill="#86592A"/>
    <!-- the fox from assets/app-icon.svg, scaled into the left third -->
    <g transform="translate(80 90) scale(0.72) translate(-250 -130)">
      <g clip-path="url(#earBack)"><rect x="100" y="100" width="824" height="824" fill="#5E3D1B"/></g>
      <g clip-path="url(#fox)">
        <rect x="100" y="100" width="824" height="824" fill="#BF8A4A"/>
        <polygon points="420,600 924,560 924,924 300,924" fill="#5E3D1B"/>
        <polygon points="100,100 400,100 300,640 100,640" fill="#F3F0E6"/>
        <polygon points="270,110 340,110 330,190 290,180" fill="#F5C400"/>
      </g>
      <g clip-path="url(#earIn)"><rect x="100" y="100" width="824" height="824" fill="#4A2F16"/></g>
      <polygon points="600,700 820,650 800,690" fill="#F3F0E6"/>
      <polygon points="560,560 600,536 644,560 600,578" fill="#2A1B0C"/>
      <polygon points="790,630 832,650 800,676" fill="#2A1B0C"/>
    </g>
    <!-- the voice, travelling from the words into the ear -->
    <path d="M 1000 140 C 820 110 640 150 520 200 C 440 234 360 262 303 256" fill="none" stroke="#F3F0E6" stroke-width="7" stroke-linecap="butt" stroke-dasharray="15 20"/>
    <!-- dune the fox peeks over -->
    <polygon points="0,560 300,520 640,575 1000,535 1280,560 1280,640 0,640" fill="#4A2F16"/>
  </g>
  <text x="600" y="330" font-family="Avenir Next, Helvetica Neue, sans-serif" font-weight="700" font-size="112" fill="#F3F0E6">Fennec</text>
  <text x="604" y="392" font-family="Avenir Next, Helvetica Neue, sans-serif" font-weight="500" font-size="34" fill="#F3F0E6">Hold a key, speak, release.</text>
  <text x="604" y="436" font-family="Avenir Next, Helvetica Neue, sans-serif" font-weight="500" font-size="26" fill="#EAD2A8">On-device dictation for macOS, terminals included.</text>
</svg>
