  <text x="600" y="300" font-family="Avenir Next, Helvetica Neue, sans-serif" font-weight="700" font-size="112" fill="#FFF4E6">Fennec</text>
  <text x="604" y="362" font-family="Avenir Next, Helvetica Neue, sans-serif" font-weight="500" font-size="34" fill="#F9BA6E">Hold a key, speak, release.</text>
  <text x="604" y="406" font-family="Avenir Next, Helvetica Neue, sans-serif" font-weight="500" font-size="26" fill="#FFE6CC" opacity="0.85">On-device dictation for macOS, terminals included.</text>
